<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Projects — CHRL STDIO</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
  </script>
</head>
<body>

  <!-- INTRO -->
  <div id="intro">
    <p id="intro-text">
      <span class="il" style="--i:0">C</span><span class="il" style="--i:1">H</span><span class="il" style="--i:2">R</span><span class="il" style="--i:3">L</span><span class="il il-gap"></span><span class="il" style="--i:4">S</span><span class="il" style="--i:5">T</span><span class="il" style="--i:6">U</span><span class="il" style="--i:7">D</span><span class="il" style="--i:8">I</span><span class="il" style="--i:9">O</span>
    </p>
  </div>

  <main id="canvas" class="subpage">
    
    <!-- TOP-LEFT: Orb + Wordmark -->
    <div id="top-left" onclick="window.location.href='index.html'">
      <a href="index.html" id="orb" aria-label="Home"></a>
      <div id="wordmark">
        <span class="wm-chrl">CHRL</span>
        <span class="wm-stdio">STDIO</span>
      </div>
    </div>

    <!-- TOP-CENTER: Navigation -->
    <nav id="top-nav">
      <a href="index.html" class="nav-item"><span class="nav-inner">Home</span></a>
      <a href="index.html#hub" class="nav-item"><span class="nav-inner" style="letter-spacing: 0.22em; transform: translateX(2px);">Work</span></a>
      <a href="about.html" class="nav-item"><span class="nav-inner">About</span></a>
      <a href="contact.html" class="nav-item"><span class="nav-inner">Contact</span></a>
    </nav>
    <button id="theme-toggle" class="magnetic" aria-label="Toggle Dark Theme">
      <div class="toggle-circle"></div>
    </button>

    <!-- CONTENT -->
    <section class="page-content">
      <h1 class="section-title">Personal Explorations</h1>
      
      <div class="project-grid" style="grid-template-columns: repeat(3, 1fr);">
        
        <div class="project-item">
          <div class="project-img" style="aspect-ratio: 1/1; background: #e0e0e0;"></div>
          <div class="project-meta">
            <span class="card-desc">Generative Poster A</span>
          </div>
        </div>

        <div class="project-item">
          <div class="project-img" style="aspect-ratio: 1/1; background: #ececec;"></div>
          <div class="project-meta">
             <span class="card-desc">Generative Poster B</span>
          </div>
        </div>

        <div class="project-item">
          <div class="project-img" style="aspect-ratio: 1/1; background: #f6f6f6;"></div>
          <div class="project-meta">
            <span class="card-desc">Algorithm C</span>
          </div>
        </div>

      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
