<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — CHRL STDIO</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
  </script>
</head>
<body>

  <!-- INTRO -->
  <div id="intro">
    <p id="intro-text">
      <span class="il" style="--i:0">C</span><span class="il" style="--i:1">H</span><span class="il" style="--i:2">R</span><span class="il" style="--i:3">L</span><span class="il il-gap"></span><span class="il" style="--i:4">S</span><span class="il" style="--i:5">T</span><span class="il" style="--i:6">U</span><span class="il" style="--i:7">D</span><span class="il" style="--i:8">I</span><span class="il" style="--i:9">O</span>
    </p>
  </div>

  <main id="canvas" class="subpage">
    
    <!-- TOP-LEFT: Orb + Wordmark -->
    <div id="top-left" onclick="window.location.href='index.html'">
      <a href="index.html" id="orb" aria-label="Home"></a>
      <div id="wordmark">
        <span class="wm-chrl">CHRL</span>
        <span class="wm-stdio">STDIO</span>
      </div>
    </div>

    <!-- TOP-CENTER: Navigation -->
    <nav id="top-nav">
      <a href="index.html" class="nav-item"><span class="nav-inner">Home</span></a>
      <a href="index.html#hub" class="nav-item"><span class="nav-inner">Work</span></a>
      <a href="about.html" class="nav-item"><span class="nav-inner">About</span></a>
      <a href="contact.html" class="nav-item"><span class="nav-inner" style="letter-spacing: 0.22em; transform: translateX(2px);">Contact</span></a>
    </nav>
    <button id="theme-toggle" class="magnetic" aria-label="Toggle Dark Theme">
      <div class="toggle-circle"></div>
    </button>

    <!-- CONTENT -->
    <section class="page-content">
      <div class="contact-hero">
        <h1 class="section-title">Let's Talk</h1>
        <p class="contact-subtitle">Have a project in mind? Let's create something amazing together.</p>
      </div>
      <div class="contact-grid">
        <a href="mailto:islam.mihoub@univ-bba.dz" class="contact-card">
          <span class="contact-icon">&#9993;</span>
          <span class="contact-label">Email</span>
          <span class="contact-value">islam.mihoub@univ-bba.dz</span>
        </a>
        <a href="https://github.com/chrollodevs" target="_blank" rel="noopener" class="contact-card">
          <span class="contact-icon">&#128187;</span>
          <span class="contact-label">GitHub</span>
          <span class="contact-value">@chrollodevs</span>
        </a>
        <a href="https://www.instagram.com/chrl_studio/" target="_blank" rel="noopener" class="contact-card">
          <span class="contact-icon">&#128247;</span>
          <span class="contact-label">Instagram</span>
          <span class="contact-value">@chrl_studio</span>
        </a>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
