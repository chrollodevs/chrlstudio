<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — CHRL STDIO</title>
  <meta name="description" content="Get in touch with Islam Mihoub — CHRL. Let's build something together." />
  <link rel="stylesheet" href="style.css" />
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
  </script>
</head>
<body>

  <!-- INTRO -->
  <div id="intro">
    <p id="intro-text">
      <span class="il" style="--i:0">C</span><span class="il" style="--i:1">H</span><span class="il" style="--i:2">R</span><span class="il" style="--i:3">L</span><span class="il il-gap"></span><span class="il" style="--i:4">S</span><span class="il" style="--i:5">T</span><span class="il" style="--i:6">U</span><span class="il" style="--i:7">D</span><span class="il" style="--i:8">I</span><span class="il" style="--i:9">O</span>
    </p>
  </div>

  <main id="canvas" class="subpage">

    <!-- TOP-LEFT: Orb + Wordmark -->
    <div id="top-left">
      <a href="index.html" id="orb" aria-label="Home"></a>
      <div id="wordmark">
        <span class="wm-chrl">CHRL</span>
        <span class="wm-stdio">STDIO</span>
      </div>
    </div>

    <!-- TOP-CENTER: Navigation -->
    <nav id="top-nav">
      <a href="index.html" class="nav-item"><span class="nav-inner">Home</span></a>
      <a href="index.html#hub" class="nav-item"><span class="nav-inner">Work</span></a>
      <a href="about.html" class="nav-item"><span class="nav-inner">About</span></a>
      <a href="contact.html" class="nav-item"><span class="nav-inner">Contact</span></a>
    </nav>
    <button id="theme-toggle" class="magnetic" aria-label="Toggle Dark Theme">
      <div class="toggle-circle"></div>
    </button>

    <!-- CONTENT -->
    <section class="page-content">
      <h1 class="section-title">Contact</h1>
      
      <div class="hub-panels" style="margin-top: 40px;">
        
        <!-- Panel 1 -->
        <a href="mailto:islammihoub77@gmail.com" class="hub-panel" data-index="01" id="email-contact-btn">
          <div class="hub-panel__bg"></div>
          <div class="hub-panel__inner">
            <span class="hub-panel__index">01</span>
            <div class="hub-panel__text">
              <h2 class="hub-panel__title">Email</h2>
              <p class="hub-panel__sub" style="text-transform: none; letter-spacing: 0;">islammihoub77@gmail.com</p>
            </div>
            <span class="hub-panel__arrow">&#8599;</span>
          </div>
        </a>

        <!-- Panel 2 -->
        <a href="https://github.com/chrollodevs" target="_blank" rel="noopener noreferrer" class="hub-panel" data-index="02">
          <div class="hub-panel__bg"></div>
          <div class="hub-panel__inner">
            <span class="hub-panel__index">02</span>
            <div class="hub-panel__text">
              <h2 class="hub-panel__title">GitHub</h2>
              <p class="hub-panel__sub" style="text-transform: none; letter-spacing: 0;">github.com/chrollodevs</p>
            </div>
            <span class="hub-panel__arrow">&#8599;</span>
          </div>
        </a>

        <!-- Panel 3 -->
        <a href="https://www.instagram.com/chrl_studio/" target="_blank" rel="noopener noreferrer" class="hub-panel" data-index="03">
          <div class="hub-panel__bg"></div>
          <div class="hub-panel__inner">
            <span class="hub-panel__index">03</span>
            <div class="hub-panel__text">
              <h2 class="hub-panel__title">Instagram</h2>
              <p class="hub-panel__sub" style="text-transform: none; letter-spacing: 0;">@chrl_studio</p>
            </div>
            <span class="hub-panel__arrow">&#8599;</span>
          </div>
        </a>

      </div>
    </section>

  </main>

  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const emailBtn = document.getElementById('email-contact-btn');
      if (emailBtn) {
        emailBtn.addEventListener('click', () => {
          navigator.clipboard.writeText('islammihoub77@gmail.com').then(() => {
            const title = emailBtn.querySelector('.hub-panel__title');
            const originalText = title.textContent;
            title.textContent = 'Copied!';
            setTimeout(() => title.textContent = originalText, 2000);
          });
        });
      }
    });
  </script>
</body>
</html>
