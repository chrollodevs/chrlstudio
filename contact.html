<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — CHRL STDIO</title>
  <meta name="description" content="Get in touch with Islam Mihoub — CHRL. Let's build something together." />
  <link rel="stylesheet" href="style.css" />
  <script>
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
  </script>
</head>
<body>

  <!-- INTRO -->
  <div id="intro">
    <p id="intro-text">
      <span class="il" style="--i:0">C</span><span class="il" style="--i:1">H</span><span class="il" style="--i:2">R</span><span class="il" style="--i:3">L</span><span class="il il-gap"></span><span class="il" style="--i:4">S</span><span class="il" style="--i:5">T</span><span class="il" style="--i:6">U</span><span class="il" style="--i:7">D</span><span class="il" style="--i:8">I</span><span class="il" style="--i:9">O</span>
    </p>
  </div>

  <main id="canvas" class="subpage">

    <!-- TOP-LEFT: Orb + Wordmark -->
    <div id="top-left" onclick="window.location.href='index.html'">
      <a href="index.html" id="orb" aria-label="Home"></a>
      <div id="wordmark">
        <span class="wm-chrl">CHRL</span>
        <span class="wm-stdio">STDIO</span>
      </div>
    </div>

    <!-- TOP-CENTER: Navigation -->
    <nav id="top-nav">
      <a href="index.html" class="nav-item"><span class="nav-inner">Home</span></a>
      <a href="index.html#hub" class="nav-item"><span class="nav-inner">Work</span></a>
      <a href="about.html" class="nav-item"><span class="nav-inner">About</span></a>
      <a href="contact.html" class="nav-item"><span class="nav-inner">Contact</span></a>
    </nav>
    <button id="theme-toggle" class="magnetic" aria-label="Toggle Dark Theme">
      <div class="toggle-circle"></div>
    </button>

    <!-- EXPERIMENTAL TERMINAL UI - QUARANTINED TO CONTACT.HTML -->
    <style>
      /* Quarantined Contact Terminal Styles */
      #terminal-viewport {
        width: 100%;
        height: 100%;
        min-height: 75vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        box-sizing: border-box;
      }

      #terminal-monitor {
        width: 100%;
        max-width: 960px; /* Increased focal scale */
        height: 70vh; /* Taller visual presence */
        border-radius: 12px;
        background: rgba(16, 16, 18, 0.85); /* Deep charcoal overlay */
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.05); /* Minimal premium border */
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6); /* Dark premium shadow */
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      /* CRT Scanlines Layer */
      #terminal-monitor::before {
        content: "";
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: repeating-linear-gradient(
          0deg,
          rgba(0,0,0,0.15),
          rgba(0,0,0,0.15) 1px,
          transparent 1px,
          transparent 2px
        );
        pointer-events: none;
        z-index: 10;
      }

      .terminal-header {
        background: transparent; /* Stripped blue wash */
        border-bottom: 1px solid rgba(255, 255, 255, 0.08); /* Clean dark mode line */
        padding: 12px 20px;
        font-family: 'SF Mono', Consolas, Menlo, monospace;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: rgba(255, 255, 255, 0.5); /* Controlled neutral system text */
        text-transform: uppercase;
        z-index: 5;
      }

      #terminal-output {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        font-family: 'SF Mono', Consolas, Menlo, monospace;
        font-size: 0.95rem;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.85); /* Calm white for main output */
        scroll-behavior: smooth;
        z-index: 5;
      }

      /* Hide terminal scrollbar for immersion */
      #terminal-output::-webkit-scrollbar { display: none; }
      #terminal-output { -ms-overflow-style: none; scrollbar-width: none; }

      .term-line { margin-bottom: 8px; word-wrap: break-word; }
      .term-line.system { color: rgba(255, 255, 255, 0.5); } /* Muted system texts */
      .term-line.user { color: #ffffff; /* Flat text */ }
      .term-line.success { color: #0a84ff; /* Flat UI blue, no glow */ }
      .term-line a { color: #0a84ff; text-decoration: underline; text-underline-offset: 4px; pointer-events: auto; }

      /* STATIC CONTACT LINKS */
      .contact-links-grid {
        display: flex;
        flex-direction: column;
        gap: 16px;
        margin-top: 32px;
        padding-top: 32px;
        border-top: 1px solid rgba(255, 255, 255, 0.08); /* Minimal architectural break */
        opacity: 0;
        animation: fadeIn 1.2s forwards;
      }

      @keyframes fadeIn {
        to { opacity: 1; }
      }

      .terminal-link-row {
        color: rgba(255, 255, 255, 0.8);
        font-family: 'SF Mono', Consolas, Menlo, monospace;
        font-size: 0.95rem;
        text-decoration: none;
        display: flex;
        align-items: center;
        transition: color 0.15s ease;
      }

      .terminal-link-row:hover {
        color: #0a84ff; /* Flat premium highlight */
      }

      .terminal-link-row .arrow {
        color: rgba(255, 255, 255, 0.3);
        margin-right: 12px;
        transition: color 0.15s ease;
        font-weight: bold;
      }

      .terminal-link-row:hover .arrow {
        color: #0a84ff;
      }

      /* === MOBILE RESPONSIVENESS (TERMINAL) === */
      @media (max-width: 768px) {
        #terminal-viewport { padding: 12px; }
        #terminal-monitor {
          height: auto;
          min-height: 55vh;
          backdrop-filter: blur(12px); /* Lower visual strain on mobile GPUs */
          -webkit-backdrop-filter: blur(12px);
        }
        #terminal-output {
          padding: 16px;
          font-size: 0.9rem; /* Condensed fit */
        }
        .contact-links-grid {
          margin-top: 16px;
          padding-top: 16px;
          gap: 24px; /* Dramatically increased touch-target gaps */
        }
        .terminal-link-row {
          font-size: 1rem; /* Better thumb readability */
          padding: 4px 0;
        }
      }
    </style>

    <div id="terminal-viewport">
      <div id="terminal-monitor">
        <div class="terminal-header">CHRL COMMUNICATION NODE</div>
        <div id="terminal-output"></div>
      </div>
    </div>

    <!-- TERMINAL INTERACTION LOGIC (Isolated) -->
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const output = document.getElementById('terminal-output');
        const isMobile = window.innerWidth <= 768; // Logic flag for responsive animation timing
        
        const bootSequence = [
          { text: "SYSTEM: initializing communication node...", delay: isMobile ? 300 : 600, type: "system" },
          { text: "SYSTEM: establishing secure channel...", delay: isMobile ? 400 : 800, type: "system" },
          { text: "SYSTEM: connection stable...", delay: isMobile ? 250 : 500, type: "success" },
          { text: "SYSTEM: loading contact interface...", delay: isMobile ? 250 : 500, type: "system" }
        ];

        async function typeLine(text, type) {
          const dp = document.createElement('div');
          dp.className = `term-line ${type}`;
          output.appendChild(dp);
          
          const typeBaseRate = isMobile ? 4 : 20; // Radically accelerate line typing for touch engagement
          const typeVariance = isMobile ? 10 : 20;

          for (let i = 0; i < text.length; i++) {
            dp.innerHTML += text.charAt(i);
            output.scrollTop = output.scrollHeight;
            await new Promise(r => setTimeout(r, typeBaseRate + Math.random() * typeVariance));
          }
        }

        async function runBoot() {
          await new Promise(r => setTimeout(r, 400)); // Pre-boot pause

          for (const step of bootSequence) {
            await typeLine(step.text, step.type);
            await new Promise(r => setTimeout(r, step.delay)); // Explicit pause between logs
          }
          
          // Cinematic Reveal of Static Contact List
          const linksHTML = `
            <div class="contact-links-grid">
              <a href="https://github.com/chrollodevs" target="_blank" class="terminal-link-row">
                <span class="arrow">&gt;</span> GITHUB NODE
              </a>
              <a href="https://linkedin.com/" target="_blank" class="terminal-link-row">
                <span class="arrow">&gt;</span> LINKEDIN NODE
              </a>
              <a href="mailto:islam.mihoub@univ-bba.dz" class="terminal-link-row">
                <span class="arrow">&gt;</span> SECURE EMAIL CHANNEL
              </a>
              <a href="#" onclick="navigator.clipboard.writeText('islam.mihoub@univ-bba.dz').then(() => alert('Contact Data Extracted: islam.mihoub@univ-bba.dz')); return false;" class="terminal-link-row">
                <span class="arrow">&gt;</span> EXTRACT CONTACT DATA
              </a>
            </div>
          `;
          
          const wrapper = document.createElement('div');
          wrapper.innerHTML = linksHTML;
          output.appendChild(wrapper);
          output.scrollTop = output.scrollHeight;
        }

        runBoot();
      });
    </script>

  </main>

  <script src="script.js"></script>
</body>
</html>
